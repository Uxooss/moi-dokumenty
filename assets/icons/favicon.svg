<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#192238"/>
      <stop offset="100%" stop-color="#0E121E"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEBB0"/>
      <stop offset="50%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#A47424"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="1.8"/>

  <!-- Left: White Certificate Silhouette -->
  <path d="M 12 12 L 28 12 L 35 19 L 35 52 A 2 2 0 0 1 33 54 L 12 54 A 2 2 0 0 1 10 52 L 10 14 A 2 2 0 0 1 12 12 Z"
        fill="#EDE7D8" stroke="#8F6216" stroke-width="0.8"/>
  <path d="M 28 12 L 28 19 L 35 19 Z" fill="#D3C9B4"/>
  <line x1="14" y1="22" x2="25" y2="22" stroke="#25324D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="27" x2="23" y2="27" stroke="#63708D" stroke-width="1" stroke-linecap="round"/>
  <line x1="14" y1="32" x2="25" y2="32" stroke="#63708D" stroke-width="1" stroke-linecap="round"/>

  <!-- Right Foreground: Merchant Marine Epaulet with 4 Gold Stripes and Anchor -->
  <g transform="translate(32, 14)">
    <!-- Epaulet Board -->
    <path d="M 3 8 C 3 2, 21 2, 21 8 L 21 40 A 2 2 0 0 1 19 42 L 5 42 A 2 2 0 0 1 3 40 Z"
          fill="#0B0F1C" stroke="url(#favGold)" stroke-width="1"/>
    
    <!-- 4 Gold Stripes -->
    <rect x="4.5" y="10" width="15" height="2" rx="0.5" fill="url(#favGold)"/>
    <rect x="4.5" y="13.5" width="15" height="2" rx="0.5" fill="url(#favGold)"/>
    <rect x="4.5" y="17" width="15" height="2" rx="0.5" fill="url(#favGold)"/>
    <rect x="4.5" y="20.5" width="15" height="2" rx="0.5" fill="url(#favGold)"/>

    <!-- Mini Gold Fouled Anchor -->
    <g transform="translate(12, 31)">
      <!-- Ring -->
      <circle cx="0" cy="-6" r="1.8" fill="none" stroke="url(#favGold)" stroke-width="0.9"/>
      <!-- Stock -->
      <line x1="-4" y1="-3.5" x2="4" y2="-3.5" stroke="url(#favGold)" stroke-width="1" stroke-linecap="round"/>
      <!-- Shank -->
      <line x1="0" y1="-3.5" x2="0" y2="4.5" stroke="url(#favGold)" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Flukes -->
      <path d="M -5 1.5 C -5 5.5, 5 5.5, 5 1.5" fill="none" stroke="url(#favGold)" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
