<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="100%" height="100%">
  <defs>
    <radialGradient id="logoBgGlowEn" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1E2333" />
      <stop offset="60%" stop-color="#141722" />
      <stop offset="100%" stop-color="#0B0D13" />
    </radialGradient>
    <linearGradient id="logoGoldEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="35%" stop-color="#E5BE64" />
      <stop offset="70%" stop-color="#C69436" />
      <stop offset="100%" stop-color="#8F6216" />
    </linearGradient>
    <linearGradient id="logoGoldLightEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="50%" stop-color="#D4A853" />
      <stop offset="100%" stop-color="#9E6E1A" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (Option 2 Badge) -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#logoBgGlowEn)" stroke="url(#logoGoldEn)" stroke-width="2.2" />
    
    <!-- Mini Certificate -->
    <rect x="14" y="14" width="34" height="48" rx="2" fill="#EFE8D6" stroke="#C5A866" stroke-width="1" transform="rotate(-6 31 38)" />
    <line x1="20" y1="26" x2="38" y2="26" stroke="#25324D" stroke-width="1.8" />
    <line x1="20" y1="32" x2="34" y2="32" stroke="#687694" stroke-width="1.2" />
    <line x1="20" y1="37" x2="36" y2="37" stroke="#687694" stroke-width="1.2" />

    <!-- Mini Captain Epaulet -->
    <g transform="translate(38, 16)">
      <path d="M 3 6 C 3 1, 23 1, 23 6 L 23 48 A 2 2 0 0 1 21 50 L 5 50 A 2 2 0 0 1 3 48 Z"
            fill="#0F1424" stroke="url(#logoGoldEn)" stroke-width="1.2" />
      
      <!-- 4 Gold Stripes -->
      <rect x="4.5" y="8" width="17" height="2.5" rx="0.5" fill="url(#logoGoldEn)" />
      <rect x="4.5" y="12" width="17" height="2.5" rx="0.5" fill="url(#logoGoldEn)" />
      <rect x="4.5" y="16" width="17" height="2.5" rx="0.5" fill="url(#logoGoldEn)" />
      <rect x="4.5" y="20" width="17" height="2.5" rx="0.5" fill="url(#logoGoldEn)" />

      <!-- Anchor -->
      <g transform="translate(13, 36)">
        <circle cx="0" cy="-7" r="2.2" fill="none" stroke="url(#logoGoldEn)" stroke-width="1.2" />
        <line x1="-5" y1="-4" x2="5" y2="-4" stroke="url(#logoGoldEn)" stroke-width="1.4" stroke-linecap="round" />
        <line x1="0" y1="-4" x2="0" y2="6" stroke="url(#logoGoldEn)" stroke-width="1.6" stroke-linecap="round" />
        <path d="M -6 2 C -6 7, 6 7, 6 2" fill="none" stroke="url(#logoGoldEn)" stroke-width="1.5" stroke-linecap="round" />
      </g>
    </g>
  </g>

  <!-- Right Typography Block -->
  <g transform="translate(108, 0)">
    <!-- Main Title -->
    <text x="0" y="47" font-family="'Philosopher', 'Cinzel', Georgia, serif" font-size="30" font-weight="700" letter-spacing="4" fill="url(#logoGoldLightEn)">
      MY DOCS
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="69" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" letter-spacing="2.6" fill="#8E95AA" text-transform="uppercase">
      CERTIFICATES · DIPLOMAS · CREDENTIALS
    </text>
  </g>
</svg>
