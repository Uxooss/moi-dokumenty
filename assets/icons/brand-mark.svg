<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bmGlow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#242A3C"/>
      <stop offset="70%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#0B0D13"/>
    </radialGradient>
    <linearGradient id="bmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="35%" stop-color="#E5BE64"/>
      <stop offset="70%" stop-color="#C69436"/>
      <stop offset="100%" stop-color="#8F6216"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Medallion Base -->
  <circle cx="64" cy="64" r="61" fill="url(#bmGlow)" stroke="url(#bmGold)" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="55" fill="none" stroke="#2D344B" stroke-width="1.2"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#bmGold)" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Centered Stylized Document & Shield Crest -->
  <g transform="translate(64, 61)">
    <!-- Document Silhouette -->
    <path d="M -22 -28 L 10 -28 L 22 -16 L 22 24 A 4 4 0 0 1 18 28 L -18 28 A 4 4 0 0 1 -22 24 Z"
          fill="#1A1E2B" stroke="url(#bmGold)" stroke-width="1.8"/>
    <!-- Folded Flap -->
    <path d="M 10 -28 L 10 -16 L 22 -16 Z" fill="#293044" stroke="url(#bmGold)" stroke-width="1.4"/>
    
    <!-- Central Shield / Monogram MD or Star -->
    <path d="M 0 -8 C 9 -8 13 -4 13 -4 C 13 10 7 19 0 23 C -7 19 -13 10 -13 -4 C -13 -4 -9 -8 0 -8 Z"
          fill="#11131C" stroke="url(#bmGold)" stroke-width="1.6"/>
    
    <!-- Gold Star in Shield -->
    <path d="M 0 0 L 1.8 4.2 L 6 4.5 L 3 7.2 L 3.8 11.2 L 0 9.2 L -3.8 11.2 L -3 7.2 L -6 4.5 L -1.8 4.2 Z"
          fill="url(#bmGold)"/>
  </g>

  <!-- Ribbon tail decor at bottom -->
  <path d="M 53 112 L 64 105 L 75 112 L 70 123 L 64 119 L 58 123 Z"
        fill="url(#bmGold)" opacity="0.9"/>
</svg>
