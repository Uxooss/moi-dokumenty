<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bmGlow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#1F2840"/>
      <stop offset="70%" stop-color="#121624"/>
      <stop offset="100%" stop-color="#090B12"/>
    </radialGradient>
    <linearGradient id="bmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="35%" stop-color="#E5BE64"/>
      <stop offset="70%" stop-color="#C69436"/>
      <stop offset="100%" stop-color="#8F6216"/>
    </linearGradient>
    <linearGradient id="stripeGradBm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A853"/>
      <stop offset="30%" stop-color="#FFF0B3"/>
      <stop offset="70%" stop-color="#E5BE64"/>
      <stop offset="100%" stop-color="#996E1D"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Frame -->
  <circle cx="64" cy="64" r="61" fill="url(#bmGlow)" stroke="url(#bmGold)" stroke-width="2.6"/>
  <circle cx="64" cy="64" r="55" fill="none" stroke="#2D344B" stroke-width="1.2"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#bmGold)" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- 4 Merchant Marine Gold Stripes across lower half -->
  <g id="stripes4">
    <rect x="22" y="74" width="84" height="4.5" rx="1.5" fill="url(#stripeGradBm)" stroke="#8F6216" stroke-width="0.6"/>
    <rect x="24" y="82" width="80" height="4.5" rx="1.5" fill="url(#stripeGradBm)" stroke="#8F6216" stroke-width="0.6"/>
    <rect x="28" y="90" width="72" height="4.5" rx="1.5" fill="url(#stripeGradBm)" stroke="#8F6216" stroke-width="0.6"/>
    <rect x="34" y="98" width="60" height="4.5" rx="1.5" fill="url(#stripeGradBm)" stroke="#8F6216" stroke-width="0.6"/>
  </g>

  <!-- Central Fouled Anchor Insignia -->
  <g transform="translate(64, 46)">
    <!-- Coiled Rope Cable -->
    <path d="M 0 -22 C 5 -22, 8 -17, 4 -12 C 1 -7, -6 -6, -6 1 C -6 7, 7 7, 7 14 C 7 20, -5 22, -9 18"
          fill="none" stroke="url(#bmGold)" stroke-width="2.4" stroke-linecap="round"/>
    
    <!-- Shackle Ring -->
    <circle cx="0" cy="-21" r="5.5" fill="none" stroke="url(#bmGold)" stroke-width="2.6"/>
    
    <!-- Stock (Crossbar) -->
    <line x1="-16" y1="-14" x2="16" y2="-14" stroke="url(#bmGold)" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="-16" cy="-14" r="2.4" fill="url(#bmGold)"/>
    <circle cx="16" cy="-14" r="2.4" fill="url(#bmGold)"/>
    
    <!-- Shank -->
    <line x1="0" y1="-14" x2="0" y2="16" stroke="url(#bmGold)" stroke-width="4.2" stroke-linecap="round"/>
    
    <!-- Arms & Flukes -->
    <path d="M -21 3 C -21 19, 21 19, 21 3" fill="none" stroke="url(#bmGold)" stroke-width="4" stroke-linecap="round"/>
    <polygon points="-24,3 -15,1 -19,8" fill="url(#bmGold)"/>
    <polygon points="24,3 15,1 19,8" fill="url(#bmGold)"/>
    
    <circle cx="0" cy="16" r="2.5" fill="url(#bmGold)"/>
  </g>
</svg>
