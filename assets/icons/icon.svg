<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1E2333" />
      <stop offset="60%" stop-color="#141722" />
      <stop offset="100%" stop-color="#0B0D13" />
    </radialGradient>
    
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="25%" stop-color="#E5BE64" />
      <stop offset="60%" stop-color="#C69436" />
      <stop offset="85%" stop-color="#DFB457" />
      <stop offset="100%" stop-color="#8F6216" />
    </linearGradient>

    <linearGradient id="goldLight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="50%" stop-color="#D4A853" />
      <stop offset="100%" stop-color="#9E6E1A" />
    </linearGradient>

    <linearGradient id="goldTrim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8F6216" />
      <stop offset="50%" stop-color="#ECC66F" />
      <stop offset="100%" stop-color="#FFF8D6" />
    </linearGradient>

    <!-- Document Surface Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222838" />
      <stop offset="100%" stop-color="#161924" />
    </linearGradient>

    <linearGradient id="backDocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1F2D" />
      <stop offset="100%" stop-color="#11141D" />
    </linearGradient>

    <!-- Subtle Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#D4A853" flood-opacity="0.35" />
    </filter>

    <filter id="sealShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base App Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow)" filter="url(#dropShadow)" />
  
  <!-- Outer Gold Rim -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#goldTrim)" stroke-width="4.5" stroke-opacity="0.85" />
  
  <!-- Subtle Inner Inset Border -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="#2E344A" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Center Artwork Group -->
  <g transform="translate(0, -6)">
    <!-- BACK DOCUMENT (Layered behind) -->
    <g transform="rotate(7 256 252)">
      <rect x="156" y="112" width="200" height="268" rx="16" fill="url(#backDocGrad)" stroke="#343B52" stroke-width="2" opacity="0.85" />
      <!-- Subtle watermark lines -->
      <line x1="184" y1="160" x2="328" y2="160" stroke="#2B3145" stroke-width="4" stroke-linecap="round" />
      <line x1="184" y1="184" x2="300" y2="184" stroke="#2B3145" stroke-width="4" stroke-linecap="round" />
      <line x1="184" y1="208" x2="316" y2="208" stroke="#2B3145" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- FRONT PRIMARY DOCUMENT -->
    <g filter="url(#dropShadow)">
      <!-- Main body with folded top-right corner -->
      <path d="M 148 108
               L 312 108
               L 364 160
               L 364 380
               A 16 16 0 0 1 348 396
               L 164 396
               A 16 16 0 0 1 148 380
               Z"
            fill="url(#docGrad)"
            stroke="url(#goldLinear)"
            stroke-width="3" />

      <!-- Folded Corner Flap -->
      <path d="M 312 108
               L 312 152
               A 8 8 0 0 0 320 160
               L 364 160
               Z"
            fill="#1E2332"
            stroke="url(#goldLinear)"
            stroke-width="2.5" />

      <!-- Document Header Guilloche / Accent Bar -->
      <rect x="180" y="148" width="104" height="6" rx="3" fill="url(#goldLinear)" />

      <!-- Document Content Placeholder Lines -->
      <rect x="180" y="174" width="152" height="4" rx="2" fill="#3D4560" />
      <rect x="180" y="196" width="128" height="4" rx="2" fill="#3D4560" />
      <rect x="180" y="218" width="144" height="4" rx="2" fill="#3D4560" />
      <rect x="180" y="240" width="112" height="4" rx="2" fill="#3D4560" />

      <!-- Security Shield Watermark on Document -->
      <path d="M 256 264
               C 278 264 296 270 296 270
               C 296 312 278 336 256 348
               C 234 336 216 312 216 270
               C 216 270 234 264 256 264 Z"
            fill="none"
            stroke="#D4A853"
            stroke-opacity="0.22"
            stroke-width="3" />
    </g>

    <!-- OFFICIAL CERTIFICATE GOLD SEAL (Bottom Right of Document) -->
    <g transform="translate(322, 350)" filter="url(#sealShadow)">
      <!-- Ribbons descending from seal -->
      <path d="M -14 14 L -22 62 L -10 54 L 0 64 L 0 16 Z"
            fill="url(#goldLight)"
            stroke="#8F6216"
            stroke-width="1.5" />
      
      <path d="M 14 14 L 22 62 L 10 54 L 0 64 L 0 16 Z"
            fill="url(#goldLinear)"
            stroke="#8F6216"
            stroke-width="1.5" />

      <!-- Scalloped rosette circle -->
      <circle cx="0" cy="0" r="44" fill="url(#goldLinear)" filter="url(#goldGlow)" />
      <circle cx="0" cy="0" r="39" fill="#131622" stroke="url(#goldTrim)" stroke-width="2" />
      <circle cx="0" cy="0" r="33" fill="none" stroke="url(#goldLight)" stroke-width="1.5" stroke-dasharray="3 3" />

      <!-- Center Emblem in Seal: Stylized Star -->
      <path d="M 0 -20
               L 5.8 -6.5
               L 19.5 -5.8
               L 9.5 4
               L 12.5 17.5
               L 0 10.5
               L -12.5 17.5
               L -9.5 4
               L -19.5 -5.8
               L -5.8 -6.5
               Z"
            fill="url(#goldLight)" />
      <circle cx="0" cy="0" r="4" fill="#131622" />
    </g>
  </g>
</svg>
